<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>cAIendar — 등록 기록</title>
<link rel="stylesheet" href="../common.css">
<style>
  body { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  header h1 { flex: 1; }
  .batch { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .batch .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .batch .when { font-weight: 600; }
  .batch .where { color: var(--muted); font-size: 12.5px; flex: 1; }
  .batch ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  .batch li { margin: 1px 0; }
  .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--muted); margin-right: 4px; }
  .tag.todo { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .msg { font-size: 12.5px; color: var(--muted); }
  .gone { opacity: .55; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 10px 0 16px; }
</style>
</head>
<body>
<header>
  <h1>등록 기록</h1>
  <span id="ver" class="msg"></span>
</header>
<p class="msg">이 확장으로 등록한 내역입니다(최근 50번). 되돌리기를 누르면 해당 일정·할 일을 캘린더에서 삭제합니다.
캘린더 앱에서 직접 지운 항목은 이미 없는 것으로 처리됩니다.</p>

<div class="bar">
  <button id="reload" type="button">새로 고침</button>
  <span class="grow" style="flex:1"></span>
  <span id="msg" class="msg"></span>
</div>

<div id="list"></div>

<script type="module" src="history.js"></script>
</body>
</html>
